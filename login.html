
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full-Bleed Background Login — uiCookies</title>
<style>
:root{--brand:#4f46e5;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bad:#dc2626;--ok:#15803d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;color:var(--ink);background:#fff;-webkit-text-size-adjust:100%}
a{color:var(--brand);text-decoration:none;font-weight:600}
a:hover{text-decoration:underline}
input,select,button{font:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

body{display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 20px;position:relative;isolation:isolate;color:#fff;
  background:#1b2540}
body::before{content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(58% 44% at 18% 22%,rgba(251,191,36,.75),transparent 62%),
    radial-gradient(52% 48% at 82% 30%,rgba(236,72,153,.62),transparent 60%),
    radial-gradient(70% 60% at 50% 92%,rgba(56,189,248,.55),transparent 64%),
    linear-gradient(155deg,#2a1b52,#0f2036 62%,#07131f)}
body::after{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(6,12,22,.32),rgba(6,12,22,.62))}
.wrap{width:100%;max-width:400px;text-align:center}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin-bottom:26px;
  text-shadow:0 1px 12px rgba(0,0,0,.5)}
.box{background:rgba(12,18,32,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:34px 30px;text-align:left;
  box-shadow:0 22px 60px rgba(3,8,18,.42)}
h1{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:#c9d2e4;font-size:.9rem;margin-bottom:24px}
label{display:block;font-size:.83rem;font-weight:600;margin-bottom:6px;color:#e3e9f5}
.field{width:100%;padding:12px 14px;border-radius:11px;font-size:.95rem;margin-bottom:16px;color:#fff;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);transition:border-color .15s,background .15s}
.field::placeholder{color:#9fabc4}
.field:focus{outline:none;border-color:#fff;background:rgba(255,255,255,.16)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:.85rem;color:#c9d2e4}
.row label{display:flex;align-items:center;gap:7px;margin:0;font-weight:500;color:#c9d2e4}
.row a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.btn{width:100%;padding:13px;border:0;border-radius:11px;background:#fff;color:#121a2b;
  font-size:.96rem;font-weight:700;cursor:pointer;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.foot{margin-top:22px;font-size:.88rem;color:#c9d2e4;text-align:center}
.foot a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.caption{margin-top:22px;font-size:.79rem;color:rgba(255,255,255,.72);text-shadow:0 1px 8px rgba(0,0,0,.5);line-height:1.6}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">Northwind</p>
  <main class="box">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to pick up where you left off.</p>
    <form onsubmit="event.preventDefault()">
      <label for="bmail">Email address</label>
      <input class="field" id="bmail" type="email" autocomplete="email" placeholder="you@company.com" required>
      <label for="bpw">Password</label>
      <input class="field" id="bpw" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <div class="row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot?</a>
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="foot">New to Northwind? <a href="#">Create an account</a></p>
  </main>
  <p class="caption">The background is CSS gradients, so the file stays self-contained.
    Swap in <code>background-image</code> and keep the dark scrim above it.</p>
</div>

<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"1aea4905526a46c1a4fc9bc1d0e89a42","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
